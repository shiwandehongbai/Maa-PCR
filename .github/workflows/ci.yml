name: Windows Build and Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.101'
      - name: Install Locked Test Dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Public Tests
        run: |
          New-Item -ItemType Directory -Force .runtime/ci | Out-Null
          python -X utf8 -B -m pytest -p scripts.public_test_policy -m "not private_replay" --basetemp .runtime/ci/test-temp --junitxml .runtime/ci/public-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Portable Candidate
        run: |
          @'
          import hashlib, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from build_release import CRT_FILES, R51_MANIFEST_SHA256, digest, download, maintenance
          baseline = Path('delivery/baselines/r51-package-manifest.json')
          if digest(baseline) != R51_MANIFEST_SHA256:
              raise ValueError('R51_crt_baseline_manifest_mismatch')
          rows = maintenance._rows(maintenance._read_json(baseline))
          archive = download({'url': 'https://github.com/shiwandehongbai/Maa-PCR/releases/download/v0.1.7/Maa-PCR-v0.1.7-win-x64.zip',
                              'sha256': 'bc6d844e2dba47d6ce6305c64812ff5a71ac449e822388e9bde2f218dc546db3'}, Path('.runtime/downloads'))
          with zipfile.ZipFile(archive) as source:
              if hashlib.sha256(source.read(maintenance.MANIFEST)).hexdigest() != R51_MANIFEST_SHA256:
                  raise ValueError('R51_crt_archive_manifest_mismatch')
              target = Path('.runtime/ci/vc-redist-r51')
              target.mkdir(parents=True, exist_ok=False)
              for name in CRT_FILES:
                  relative = 'runtime/python/' + name
                  data = source.read(relative)
                  if len(data) != rows[relative]['size'] or hashlib.sha256(data).hexdigest() != rows[relative]['sha256']:
                      raise ValueError('R51_crt_payload_mismatch: ' + name)
                  (target / name).write_bytes(data)
          '@ | python -X utf8 -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B scripts/build_release.py --output .runtime/ci/build --base-manifest delivery/baselines/r66-package-manifest.json --vc-redist .runtime/ci/vc-redist-r51
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: GUI Update Contract Checks
        run: |
          $evidence = [IO.Path]::GetFullPath((Join-Path (Get-Location) '.runtime/ci/gui-checks'))
          dotnet run --project gui/MFAAvalonia/PcrUpdate.Tests/PcrUpdate.Tests.csproj --configuration Release --runtime win-x64 -p:Platform=x64 -p:RestorePackagesWithLockFile=true -p:RestoreLockedMode=true -p:UsedAvaloniaProducts= -- $evidence | Tee-Object -FilePath .runtime/ci/gui-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PCR_STARTUP_TEST_PYTHON = (Get-Command python).Source
          $startupEvidence = [IO.Path]::GetFullPath((Join-Path (Get-Location) '.runtime/ci/startup-actions'))
          dotnet run --project gui/MFAAvalonia/PcrUpdate.Tests/PcrUpdate.Tests.csproj --configuration Release --runtime win-x64 -p:Platform=x64 --no-build -- $startupEvidence --startup-actions-only | Tee-Object -FilePath .runtime/ci/startup-actions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Labyrinth GUI Contract Checks
        run: |
          $evidence = [IO.Path]::GetFullPath((Join-Path (Get-Location) '.runtime/ci/labyrinth-checks'))
          $source = [IO.Path]::GetFullPath((Get-Location).Path)
          $core = [IO.Path]::GetFullPath((Join-Path (Get-Location) '.runtime/ci/build/player/libs'))
          $native = [IO.Path]::GetFullPath((Join-Path (Get-Location) '.runtime/ci/build/player/runtimes/win-x64/native'))
          dotnet run --project gui/MFAAvalonia/PcrLabyrinthCredentials.Tests/PcrLabyrinthCredentials.Tests.csproj --configuration Release -p:PcrCoreDirectory=$core -p:PcrNativeDirectory=$native -p:RestorePackagesWithLockFile=true -p:RestoreLockedMode=true -- $evidence $source | Tee-Object -FilePath .runtime/ci/credentials-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = (Get-Command python).Source
          dotnet build gui/MFAAvalonia/PcrProfileSwitch.Tests/PcrProfileSwitch.Tests.csproj --configuration Release -p:Platform=x64 -p:PcrCoreDirectory=$core -p:PcrNativeDirectory=$native -p:RestorePackagesWithLockFile=true -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $source 'gui/MFAAvalonia/PcrProfileSwitch.Tests/bin/x64/Release/net10.0'
          $dll = Join-Path $binary 'PcrProfileSwitch.Tests.dll'
          $profileEvidence = Join-Path $source '.runtime/ci/profile-checks'
          New-Item -ItemType Directory -Force $profileEvidence | Out-Null
          foreach ($mode in @('default', 'clan-daily-only', 'clan-workflow-only', 'clan-formal-only', 'clan-postsave-only', 'profile-registration-only')) {
            $coreHash = (Get-FileHash -Algorithm SHA256 (Join-Path $core 'MFAAvalonia.Core.dll')).Hash
            if ((Get-FileHash -Algorithm SHA256 (Join-Path $binary 'MFAAvalonia.Core.dll')).Hash -ne $coreHash) { throw 'Profile checks do not reference the current packaged Core build.' }
            $coreHash | Set-Content -Encoding utf8 (Join-Path $profileEvidence "$mode.core.sha256")
            $fixture = Join-Path $profileEvidence "fixtures/$mode"
            $arguments = @($dll, $source, $fixture, $python) | ForEach-Object { '"' + $_ + '"' }
            if ($mode -ne 'default') { $arguments += "--$mode" }
            $check = Start-Process -FilePath (Get-Command dotnet).Source -ArgumentList $arguments -WorkingDirectory $binary -WindowStyle Hidden -PassThru -RedirectStandardOutput (Join-Path $profileEvidence "$mode.log") -RedirectStandardError (Join-Path $profileEvidence "$mode.stderr.log")
            if (-not $check.WaitForExit(600000)) { $check.Kill($true); throw "Profile check $mode timed out." }
            if ($check.ExitCode -ne 0) { throw "Profile check $mode exited $($check.ExitCode)." }
          }
      - name: Labyrinth Parity GUI Checks
        run: |
          $source = [IO.Path]::GetFullPath((Get-Location).Path)
          $core = Join-Path $source '.runtime/ci/build/player/libs'
          $native = Join-Path $source '.runtime/ci/build/player/runtimes/win-x64/native'
          $evidence = Join-Path $source '.runtime/ci/parity-gui-checks'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          foreach ($project in @('PcrLabyrinthAccounts.Tests', 'PcrLabyrinthRatings.Tests')) {
            dotnet build "gui/MFAAvalonia/$project/$project.csproj" --configuration Release -p:Platform=x64 -p:PcrCoreDirectory=$core -p:PcrNativeDirectory=$native -p:RestorePackagesWithLockFile=true -p:RestoreLockedMode=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $binary = Join-Path $source "gui/MFAAvalonia/$project/bin/x64/Release/net10.0"
            $coreHash = (Get-FileHash -Algorithm SHA256 (Join-Path $core 'MFAAvalonia.Core.dll')).Hash
            if ((Get-FileHash -Algorithm SHA256 (Join-Path $binary 'MFAAvalonia.Core.dll')).Hash -ne $coreHash) { throw 'Parity checks do not reference the current packaged Core build.' }
            $coreHash | Set-Content -Encoding utf8 (Join-Path $evidence "$project.core.sha256")
            $arguments = @((Join-Path $binary "$project.dll"), (Join-Path $evidence "$project/fixtures"), $source) | ForEach-Object { '"' + $_ + '"' }
            $check = Start-Process -FilePath (Get-Command dotnet).Source -ArgumentList $arguments -WorkingDirectory $binary -WindowStyle Hidden -PassThru -RedirectStandardOutput (Join-Path $evidence "$project.log") -RedirectStandardError (Join-Path $evidence "$project.stderr.log")
            if (-not $check.WaitForExit(600000)) { $check.Kill($true); throw "Parity check $project timed out." }
            if ($check.ExitCode -ne 0) { throw "Parity check $project exited $($check.ExitCode)." }
          }
      - name: Bundled Runtime Checks
        run: |
          $env:PCR_PLAYER_PACKAGE_ROOT = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '.runtime/ci/build/player'))
          $env:PCR_PLAYER_PACKAGE_ALIAS = $env:PCR_PLAYER_PACKAGE_ROOT
          python -X utf8 -B -m pytest tests/test_player_candidate.py::test_packaged_runtime_ignores_external_python_environment tests/test_player_candidate.py::test_packaged_native_crt_loads_from_python_directory tests/test_player_candidate.py::test_native_entry_uses_bundled_runtime --basetemp .runtime/ci/bundled-runtime-temp --junitxml .runtime/ci/bundled-runtime.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish Build Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-and-tests
          include-hidden-files: true
          retention-days: 30
          path: |
            .runtime/ci/public-tests.xml
            .runtime/ci/bundled-runtime.xml
            .runtime/ci/bundled-runtime-temp/
            .runtime/ci/gui-checks.log
            .runtime/ci/startup-actions.log
            .runtime/ci/startup-actions/
            .runtime/ci/credentials-checks.log
            .runtime/ci/profile-checks/
            .runtime/ci/parity-gui-checks/
            .runtime/ci/build/*.json
            .runtime/ci/build/*.log
            .runtime/ci/build/Maa-PCR-*-win-x64.zip
            .runtime/ci/build/Maa-PCR-*-source.zip
            .runtime/ci/build/Maa-PCR-R*-to-R*.patch.zip
          if-no-files-found: warn
  source-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITLEAKS_VERSION: 8.24.3
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
