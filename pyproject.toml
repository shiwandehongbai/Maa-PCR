[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcr-agent-maa"
version = "0.1.21"
description = "PCR CN automation with bounded Maa navigation and labyrinth support"
requires-python = ">=3.13,<3.14"
dependencies = [
    "attrs==26.1.0",
    "certifi==2024.8.30",
    "charset-normalizer==3.3.2",
    "idna==3.8",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "maaagentbinary==1.0.1",
    "maafw==5.13.0",
    "msgpack==1.1.0",
    "numpy==2.4.6",
    "opencv-python-headless==5.0.0.93",
    "pillow==12.3.0",
    "pycryptodome==3.20.0",
    "pydantic==1.10.21",
    "referencing==0.37.0",
    "requests==2.32.3",
    "rpds-py==2026.6.3",
    "strenum==0.4.15",
    "typing-extensions==4.16.0",
    "urllib3==2.2.3",
]

[project.scripts]
pcr-maa = "pcr_maa.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["private_replay: optional private evidence, excluded from mandatory public CI"]
